<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dragonfire: Dani's Reign</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070304">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dragonfire">
<meta name="application-name" content="Dragonfire">
<meta name="description" content="Dragonfire: Dani's Reign. Ride your dragon, breathe fire, rule the skies.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;width:100%;height:100%;background:#070304;overflow:hidden;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto;cursor:crosshair;touch-action:none;box-shadow:0 0 50px #a0140a44}
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>
"use strict";
// ================= DRAGONFIRE: DANI'S REIGN =================
let W = 960, H = 600;            // logical play-field size (changes with screen aspect)
let VS = 1, DPR = 1;             // logical->backing scale, device pixel ratio (capped)
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

let fitQueued = false;
function queueFit() { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); }
function fit() {
  const vv = window.visualViewport;
  const vw = Math.max(1, vv ? vv.width : innerWidth), vh = Math.max(1, vv ? vv.height : innerHeight);
  const ar = Math.min(2.5, Math.max(0.4, vw / vh));
  const SHORT = IS_TOUCH ? 520 : 600;      // bigger sprites/HUD on phones
  if (ar >= 1) { H = SHORT; W = Math.round(SHORT * ar); } else { W = SHORT; H = Math.round(SHORT / ar); }
  const s = Math.min(vw / W, vh / H);
  const cssW = Math.floor(W * s), cssH = Math.floor(H * s);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * DPR); cv.height = Math.round(cssH * DPR);
  VS = cv.width / W;
  buildBackground();
  if (player) { player.x = Math.min(Math.max(player.x, player.r), W - player.r); player.y = Math.min(Math.max(player.y, player.r), H - player.r); }
  for (const e of enemies) { if (e.boss) { e.x = Math.min(e.x, W - 60); e.y = Math.min(e.y, H - 60); } }
}
addEventListener('resize', queueFit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', queueFit);

// ---------- utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

// ---------- storage ----------
const HS_KEY = 'dragonfire_highscore';
let highScore = 0;
try { highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; } catch (e) {}
function saveHS() { try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, muted = false;
try { muted = localStorage.getItem('dragonfire_muted') === '1'; } catch (e) {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.35;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = muted ? 0 : 0.35;
  try { localStorage.setItem('dragonfire_muted', muted ? '1' : '0'); } catch (e) {}
  toast(muted ? 'SOUND OFF' : 'SOUND ON');
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || muted) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq) {
  if (!actx || muted) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 2000;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
let lastShotSnd = 0;
const SFX = {
  shoot() { const n = performance.now(); if (n - lastShotSnd < 60) return; lastShotSnd = n; noise(0.12, 0.13, 1400); tone('sawtooth', 140, 70, 0.1, 0.04); },
  hit() { tone('triangle', 400, 120, 0.06, 0.12); },
  kill() { noise(0.18, 0.25, 3000); tone('sawtooth', 300, 60, 0.15, 0.1); },
  hurt() { tone('sawtooth', 160, 50, 0.25, 0.25); noise(0.2, 0.2, 800); },
  pickup() { tone('sine', 523, 523, 0.08, 0.2); tone('sine', 784, 784, 0.12, 0.2, 0.08); },
  wave() { [196, 262, 392].forEach((f, i) => tone('triangle', f, f, 0.35, 0.16, i * 0.22)); tone('sawtooth', 98, 98, 0.9, 0.05, 0); },
  boss() { tone('sawtooth', 180, 45, 1.4, 0.3); tone('square', 90, 35, 1.5, 0.18, 0.1); noise(1.4, 0.3, 600); },
  dash() { noise(0.12, 0.18, 5000); tone('sine', 200, 900, 0.1, 0.1); },
  zap() { tone('triangle', 700, 180, 0.09, 0.1); noise(0.05, 0.08, 4000); },
  over() { [294, 262, 220, 147].forEach((f, i) => tone('triangle', f, f * 0.98, 0.45, 0.2, i * 0.3)); },
  bossDie() { for (let i = 0; i < 6; i++) { tone('sawtooth', 400 - i * 50, 40, 0.4, 0.15, i * 0.1); } noise(1.2, 0.35, 1500); }
};

// ---------- input: keyboard / mouse ----------
const keys = Object.create(null);
const mouse = { x: W / 2, y: H / 2, down: false };
let inputMode = IS_TOUCH ? 'touch' : 'kb'; // 'kb', 'pad' or 'touch'
let lastTouch = -1e9;
const fromTouch = () => performance.now() - lastTouch < 1000;
addEventListener('keydown', e => {
  initAudio();
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (!keys[k]) onPress(k);
  keys[k] = true; inputMode = 'kb';
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', e => { if (fromTouch()) return; toCanvas(e); inputMode = 'kb'; });
cv.addEventListener('mousedown', e => {
  if (fromTouch()) return;
  toCanvas(e); initAudio(); inputMode = 'kb';
  if (e.button === 0) { mouse.down = true; if (state === 'title' || state === 'over') startGame(); }
  if (e.button === 2) tryDash();
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { mouse.down = false; for (const k in keys) keys[k] = false; if (state === 'play') state = 'paused'; });

function onPress(k) {
  if (k === 'm') { setMuted(!muted); return; }
  if (k === 'p' || k === 'escape') { togglePause(); return; }
  if ((k === 'enter' || k === ' ') && (state === 'title' || state === 'over')) { startGame(); return; }
  if ((k === 'shift' || k === ' ') && state === 'play') tryDash();
}
function togglePause() {
  if (state === 'play') { state = 'paused'; tone('sine', 440, 220, 0.1, 0.1); }
  else if (state === 'paused') { state = 'play'; tone('sine', 220, 440, 0.1, 0.1); }
}

// ---------- input: gamepad (DualSense, standard mapping) ----------
const DEAD = 0.15;
let padIndex = -1;
const padPrev = [];
const pad = { lx: 0, ly: 0, rx: 0, ry: 0, r2: 0, active: false };
function dz(x, y) {
  const m = Math.hypot(x, y);
  if (m < DEAD) return [0, 0];
  const s = Math.min(1, (m - DEAD) / (1 - DEAD)) / m;
  return [x * s, y * s];
}
addEventListener('gamepadconnected', e => {
  padIndex = e.gamepad.index; inputMode = 'pad';
  toast('🎮 CONTROLLER CONNECTED');
});
addEventListener('gamepaddisconnected', e => {
  if (e.gamepad.index === padIndex) { padIndex = -1; pad.active = false; inputMode = 'kb'; toast('CONTROLLER DISCONNECTED'); if (state === 'play') state = 'paused'; }
});
function getPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (!pads) return null;
  if (padIndex >= 0 && pads[padIndex]) return pads[padIndex];
  for (const p of pads) if (p && p.connected) { padIndex = p.index; return p; }
  return null;
}
function btnVal(b) { return b ? (typeof b === 'object' ? (b.value || (b.pressed ? 1 : 0)) : b) : 0; }
function pollPad() {
  const g = getPad();
  pad.active = !!g;
  if (!g) return;
  const b = g.buttons, a = g.axes;
  const pressed = i => !!(b[i] && b[i].pressed);
  const edge = i => pressed(i) && !padPrev[i];
  [pad.lx, pad.ly] = dz(a[0] || 0, a[1] || 0);
  [pad.rx, pad.ry] = dz(a[2] || 0, a[3] || 0);
  pad.r2 = btnVal(b[7]);
  // d-pad also moves
  if (pressed(12)) pad.ly = -1; if (pressed(13)) pad.ly = 1;
  if (pressed(14)) pad.lx = -1; if (pressed(15)) pad.lx = 1;
  let any = pad.lx || pad.ly || pad.rx || pad.ry || pad.r2 > 0.1;
  for (let i = 0; i < b.length; i++) if (pressed(i)) any = true;
  if (any) { inputMode = 'pad'; initAudio(); }
  if (edge(9)) togglePause();                         // Options
  if (edge(8) || edge(17)) setMuted(!muted);           // Share/Create or Touchpad
  if (edge(0)) {                                        // Cross
    if (state === 'title' || state === 'over') startGame();
    else if (state === 'paused') togglePause();
    else if (state === 'play') tryDash();
  }
  if (edge(6) && state === 'play') tryDash();           // L2
  if (edge(4) && state === 'play') tryDash();           // L1
  for (let i = 0; i < b.length; i++) padPrev[i] = pressed(i);
}
function rumble(strong, weak, ms) {
  if (inputMode !== 'pad') return;
  const g = getPad(); if (!g) return;
  try {
    const va = g.vibrationActuator;
    if (va && typeof va.playEffect === 'function') {
      va.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {});
    } else if (g.hapticActuators && g.hapticActuators[0] && g.hapticActuators[0].pulse) {
      g.hapticActuators[0].pulse(strong, ms);
    }
  } catch (e) {}
}

// ---------- input: touch (twin virtual sticks) ----------
const STICK_R = 64;
const touch = { move: null, aim: null, mvx: 0, mvy: 0, avx: 0, avy: 0 };
function touchButtons() {
  return { dash: { x: W - 78, y: H - 170, r: 40 }, pause: { x: W - 34, y: 100, r: 24 } };
}
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function hitC(c, x, y) { return dist2(c.x, c.y, x, y) <= (c.r + 12) * (c.r + 12); }
function stickVec(st) {
  if (!st) return [0, 0];
  const dx = st.x - st.ox, dy = st.y - st.oy, m = Math.hypot(dx, dy);
  if (m < STICK_R * 0.12) return [0, 0];
  const k = Math.min(1, m / STICK_R) / m;
  return [dx * k, dy * k];
}
let overAt = 0;
function goFullscreen() {
  if (!IS_TOUCH) return;
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) return;
  if (window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches)) { lockLandscape(); return; }
  const rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!rq) return;
  try { const p = rq.call(el, { navigationUI: 'hide' }); if (p && p.then) p.then(lockLandscape).catch(() => {}); } catch (err) {}
}
function lockLandscape() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (err) {}
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault();
  lastTouch = performance.now(); inputMode = 'touch'; initAudio();
  const [x, y] = toLogical(e);
  if (state === 'title' || state === 'over') {
    goFullscreen();
    if (state === 'over' && time - overAt < 0.9) return;   // avoid accidental instant restart
    startGame(); return;
  }
  if (state === 'paused') { goFullscreen(); togglePause(); return; }
  const B = touchButtons();
  if (hitC(B.pause, x, y)) { togglePause(); return; }
  if (hitC(B.dash, x, y)) { tryDash(); return; }
  if (x < W / 2) { if (!touch.move) touch.move = { id: e.pointerId, ox: x, oy: y, x, y }; }
  else if (!touch.aim) touch.aim = { id: e.pointerId, ox: x, oy: y, x, y };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault(); lastTouch = performance.now();
  const [x, y] = toLogical(e);
  for (const st of [touch.move, touch.aim]) {
    if (!st || st.id !== e.pointerId) continue;
    st.x = x; st.y = y;
    const dx = x - st.ox, dy = y - st.oy, m = Math.hypot(dx, dy);
    if (m > STICK_R * 1.4) { const k = (m - STICK_R * 1.4) / m; st.ox += dx * k; st.oy += dy * k; } // stick follows thumb
  }
}, { passive: false });
function endTouch(e) {
  if (e.pointerType === 'mouse') return;
  if (touch.move && touch.move.id === e.pointerId) touch.move = null;
  if (touch.aim && touch.aim.id === e.pointerId) touch.aim = null;
}
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
cv.addEventListener('lostpointercapture', endTouch);
// block scrolling / zoom / pull-to-refresh / long-press menus / double-tap zoom
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick'])
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; touch.move = touch.aim = null; });

function drawTouchUI() {
  if (inputMode !== 'touch' || state !== 'play') return;
  const B = touchButtons();
  const drawStick = (st, gx, gy, label) => {
    const ox = st ? st.ox : gx, oy = st ? st.oy : gy;
    ctx.globalAlpha = st ? 0.5 : 0.2;
    ctx.strokeStyle = '#f0b84a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ox, oy, STICK_R, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(240,184,74,0.12)'; ctx.fill();
    let kx = ox, ky = oy;
    if (st) { const [vx, vy] = stickVec(st); kx = ox + vx * STICK_R; ky = oy + vy * STICK_R; }
    ctx.fillStyle = '#f0b84a'; ctx.beginPath(); ctx.arc(kx, ky, 26, 0, 6.283); ctx.fill();
    if (!st) { ctx.globalAlpha = 0.45; ctx.fillStyle = '#e8dcc4'; ctx.font = 'bold 12px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(label, gx, gy + STICK_R + 20); }
    ctx.globalAlpha = 1;
  };
  drawStick(touch.move, 110, H - 110, 'MOVE');
  drawStick(touch.aim, W - 190, H - 100, 'AIM + BREATHE FIRE');
  // dash button
  const dr = Math.min(1, Math.max(0, 1 - player.dashCd / 0.9));
  ctx.globalAlpha = dr >= 1 ? 0.75 : 0.35;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(B.dash.x, B.dash.y, B.dash.r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#f0b84a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(B.dash.x, B.dash.y, B.dash.r, -1.571, -1.571 + 6.283 * dr); ctx.stroke();
  ctx.fillStyle = '#f0b84a'; ctx.font = 'bold 14px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText('SWOOP', B.dash.x, B.dash.y + 5);
  // pause button
  ctx.globalAlpha = 0.6; ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(B.pause.x, B.pause.y, B.pause.r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#cde'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#cde'; ctx.fillRect(B.pause.x - 7, B.pause.y - 9, 5, 18); ctx.fillRect(B.pause.x + 2, B.pause.y - 9, 5, 18);
  ctx.globalAlpha = 1;
}

// ---------- toast ----------
let toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 2.2; }

// ---------- game state ----------
let state = 'title';
let player = null, bullets = [], ebullets = [], enemies = [], particles = [], pickups = [], floaters = [];
let score = 0, wave = 0, waveToSpawn = 0, spawnTimer = 0, waveDelay = 0, bossAlive = false, shake = 0, combo = 1, comboT = 0, time = 0, newHigh = false;
const bg = document.createElement('canvas');
const embers = [];
function updateEmbers(dt) {
  while (embers.length < 55) embers.push({ x: Math.random() * W, y: H + Math.random() * H, vy: rand(18, 55), ph: rand(0, 6.283), sz: rand(1, 2.6), a: rand(0.3, 0.9) });
  for (const m of embers) { m.y -= m.vy * dt; m.ph += dt * 1.7; m.x += Math.sin(m.ph) * 14 * dt; if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; } }
}
function drawEmbers() {
  ctx.globalCompositeOperation = 'lighter';
  for (const m of embers) { ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(m.ph * 3)); ctx.fillStyle = m.sz > 2 ? '#ff9a3a' : '#ff5a1a'; ctx.fillRect(m.x, m.y, m.sz, m.sz); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function startGame() {
  initAudio();
  player = { x: W / 2, y: H / 2, r: 14, hp: 100, maxHp: 100, ang: 0, cd: 0, rapid: 0, shield: 0, inv: 0,
             dash: 0, dashCd: 0, dvx: 0, dvy: 0, walk: 0 };
  bullets = []; ebullets = []; enemies = []; particles = []; pickups = []; floaters = [];
  score = 0; wave = 0; waveToSpawn = 0; spawnTimer = 0; waveDelay = 1.2; bossAlive = false;
  shake = 0; combo = 1; comboT = 0; time = 0; newHigh = false;
  state = 'play';
  tone('sawtooth', 120, 260, 0.5, 0.12); noise(0.5, 0.15, 900);
}

function nextWave() {
  wave++;
  if (wave % 5 === 0) {
    spawnBoss();
    waveToSpawn = 0;
    banner('WAVE ' + wave, 'ASHWING THE BLACK DESCENDS');
    SFX.boss(); rumble(1, 1, 600);
  } else {
    waveToSpawn = 6 + wave * 3;
    banner('WAVE ' + wave, waveFlavor[(wave - 1) % waveFlavor.length]);
    SFX.wave();
  }
  spawnTimer = 0.5;
}
const waveFlavor = ['Ravens carry word of your coming', 'The usurper\'s knights march', 'Bolts fly from the walls',
  'Rival riders take to the sky', 'Burn the siege engines', 'Blood and embers', 'The old city trembles', 'No mercy for oathbreakers'];
let bannerT = 0, bannerA = '', bannerB = '';
function banner(a, b) { bannerA = a; bannerB = b; bannerT = 2.4; }

// ---------- enemies ----------
const ETYPES = {
  raven:  { r: 10, hp: 1, spd: 150, score: 50, col: '#ff7a30', dmg: 8 },
  knight: { r: 13, hp: 3, spd: 90, score: 100, col: '#d8dce4', dmg: 12 },
  rider:  { r: 20, hp: 8, spd: 60, score: 250, col: '#ff4020', dmg: 20 },
  xbow:   { r: 15, hp: 4, spd: 55, score: 200, col: '#d09050', dmg: 10 }
};
function edgePoint() {
  const s = Math.random() * 4 | 0;
  if (s === 0) return [rand(0, W), -30];
  if (s === 1) return [W + 30, rand(0, H)];
  if (s === 2) return [rand(0, W), H + 30];
  return [-30, rand(0, H)];
}
function spawnEnemy(type, x, y) {
  const t = ETYPES[type];
  if (x === undefined) [x, y] = edgePoint();
  const hpScale = 1 + Math.floor((wave - 1) / 5) * 0.5;
  const spdScale = 1 + Math.min(0.6, wave * 0.03);
  enemies.push({ type, x, y, r: t.r, hp: Math.ceil(t.hp * hpScale), maxHp: Math.ceil(t.hp * hpScale),
    spd: t.spd * spdScale * rand(0.9, 1.1), col: t.col, dmg: t.dmg, score: t.score,
    vx: 0, vy: 0, t: rand(0, 10), flash: 0, cd: rand(1.5, 3), boss: false });
}
function pickType() {
  const r = Math.random();
  if (wave >= 6 && r < 0.12) return 'xbow';
  if (wave >= 3 && r < 0.28) return 'rider';

// ---------- particles ----------
function burst(x, y, col, n, spd, life) {

    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, col, sz: rand(1.5, 3.5) });

  if (inputMode === 'pad') { mx = pad.lx; my = pad.ly; }
  else if (inputMode === 'touch') { [mx, my] = stickVec(touch.move); }

// ---------- pickups ----------
const PTYPES = {
  wildfire: { col: '#5dff5a', label: 'WILDFIRE', sub: 'WILDFIRE!' },
  egg:      { col: '#ffb030', label: 'DRAGON EGG', sub: 'EGG SHIELD' },

function dropPickup(x, y, type) { pickups.push({ x: clamp(x, 20, W - 20), y: clamp(y, 20, H - 20), type, t: 0, life: 10 }); }
function collect(p) {

// ---------- update ----------
function update(dt) {
  time += dt;

  if (state !== 'play') { updateParticles(dt * (state === 'paused' ? 0 : 1)); return; }
  if (bannerT > 0) bannerT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  // wave control
  if (waveToSpawn <= 0 && !bossAlive && enemies.length === 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) { nextWave(); waveDelay = 2.0; }
  }
  if (waveToSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const groupN = Math.random() < 0.25 ? 3 : 1;
      for (let i = 0; i < groupN && waveToSpawn > 0; i++) { spawnEnemy(pickType()); waveToSpawn--; }
      spawnTimer = Math.max(0.18, 0.9 - wave * 0.05) * rand(0.6, 1.3);

  }

  const p = player;
  let mx, my;
  if (inputMode === 'pad') { mx = pad.lx; my = pad.ly; }
  else if (inputMode === 'touch') { [mx, my] = stickVec(touch.move); }
  else {
    mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);

  else { p.x += mx * spd * dt; p.y += my * spd * dt; }
  if (mx || my) p.walk += dt * 12;
  p.x = clamp(p.x, p.r, W - p.r); p.y = clamp(p.y, p.r, H - p.r);
  p.cd -= dt; p.dashCd -= dt; p.inv -= dt;

  }

    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (dist2(b.x, b.y, e.x, e.y) < (e.r + 7) * (e.r + 7)) {
        e.hp -= 0.5; e.flash = 0.08;
        e.x += b.vx * 0.006 * (e.boss ? 0.1 : 1); e.y += b.vy * 0.006 * (e.boss ? 0.1 : 1);

      if (!e.boss && state === 'play') { e.hp -= 2; burst(e.x, e.y, e.col, 8, 150, 0.4); if (e.hp <= 0) { killEnemy(i, true); continue; }
        e.x -= dx / d * 30; e.y -= dy / d * 30; }
    }
  }

  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.boss) continue;
    for (let j = i + 1; j < Math.min(enemies.length, i + 8); j++) {
      const b = enemies[j]; if (b.boss) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 < rr * rr && d2 > 0.01) { const d = Math.sqrt(d2), push = (rr - d) * 0.5 / d; a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push; }

    const b = ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { ebullets.splice(i, 1); continue; }
    if (dist2(b.x, b.y, p.x, p.y) < (p.r + b.r) * (p.r + b.r)) { ebullets.splice(i, 1); damagePlayer(b.dmg, b.x, b.y); }
  }

  // pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const k = pickups[i]; k.t += dt; k.life -= dt;
    if (k.life <= 0) { pickups.splice(i, 1); continue; }
    const d2 = dist2(k.x, k.y, p.x, p.y);

  }

}
function fireE(x, y, a, s, dmg, kind) { ebullets.push({ x, y, a, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: kind === 'bolt' ? 5 : 7, life: 5, dmg: dmg || 10, kind: kind || 'fire' }); }

  e.y += Math.cos(e.t * 0.5) * 50 * dt + dy / d * e.spd * 0.4 * dt;

function killEnemy(j, noScore) {

    score += pts; floater(e.x, e.y - e.r, '+' + pts, '#fff');

  }

  burst(e.x, e.y, '#ffffff', e.boss ? 40 : 5, 300, 0.3);

function updateParticles(dt) {

    const q = particles[i]; q.life -= dt;
    if (q.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
  }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.t -= dt; f.y -= 30 * dt; if (f.t <= 0) floaters.splice(i, 1); }
}

// ---------- rendering ----------
function buildBackground() {

  const b = bg.getContext('2d');
  // scorched earth / castle courtyard seen from the sky
  const base = b.createLinearGradient(0, 0, 0, H); base.addColorStop(0, '#120807'); base.addColorStop(1, '#0a0505');
  b.fillStyle = base; b.fillRect(0, 0, W, H);
  // flagstones
  for (let y = 0; y < H; y += 38) {
    let x = -((y / 38) % 2) * 30;
    while (x < W) {
      const w = rand(46, 84), c = 15 + Math.random() * 11 | 0;
      b.fillStyle = `rgb(${c + 6},${c},${c - 3})`; b.fillRect(x + 2, y + 2, w - 4, 34);
      b.fillStyle = 'rgba(0,0,0,0.25)'; b.fillRect(x + 2, y + 30, w - 4, 6);
      x += w;
    }
  }
  // grime speckle
  for (let i = 0; i < 1800; i++) { b.fillStyle = `rgba(0,0,0,${Math.random() * 0.25})`; b.fillRect(Math.random() * W, Math.random() * H, 3, 3); }
  // glowing lava cracks
  for (let k = 0; k < 7; k++) {
    let x = rand(80, W - 80), y = rand(80, H - 80); const pts = [[x, y]];
    let a = rand(0, 6.283);
    for (let i = 0; i < 9; i++) { a += rand(-0.7, 0.7); x += Math.cos(a) * 22; y += Math.sin(a) * 22; pts.push([x, y]); }
    for (const [lw, col] of [[9, 'rgba(255,60,10,0.07)'], [4, 'rgba(255,90,20,0.25)'], [1.5, 'rgba(255,190,90,0.6)']]) {
      b.strokeStyle = col; b.lineWidth = lw; b.lineJoin = 'round'; b.beginPath(); b.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts) b.lineTo(p[0], p[1]); b.stroke();
    }
  }
  // scattered bones & scorch marks
  for (let i = 0; i < 10; i++) {
    const x = rand(60, W - 60), y = rand(60, H - 60), r = rand(18, 44);
    const g = b.createRadialGradient(x, y, 2, x, y, r); g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.beginPath(); b.arc(x, y, r, 0, 6.283); b.fill();
  }
  // castle curtain wall with crenellations
  const T = 18;
  b.fillStyle = '#2a2220'; b.fillRect(0, 0, W, T); b.fillRect(0, H - T, W, T); b.fillRect(0, 0, T, H); b.fillRect(W - T, 0, T, H);
  b.fillStyle = '#3b302c';
  for (let x = 0; x < W; x += 22) { b.fillRect(x, T - 2, 12, 7); b.fillRect(x, H - T - 5, 12, 7); }
  for (let y = 0; y < H; y += 22) { b.fillRect(T - 2, y, 7, 12); b.fillRect(W - T - 5, y, 7, 12); }
  // round towers in the corners and middles
  const towers = [[26, 26], [W - 26, 26], [26, H - 26], [W - 26, H - 26], [W / 2, 18], [W / 2, H - 18]];
  for (const [x, y] of towers) {
    b.fillStyle = '#231b19'; b.beginPath(); b.arc(x, y, 34, 0, 6.283); b.fill();
    b.fillStyle = '#3d312d'; for (let i = 0; i < 12; i++) { const a = i * 0.5236; b.fillRect(x + Math.cos(a) * 30 - 4, y + Math.sin(a) * 30 - 4, 8, 8); }
    b.fillStyle = '#5a1010'; b.beginPath(); b.arc(x, y, 18, 0, 6.283); b.fill();      // crimson roof
    b.strokeStyle = '#2a0606'; b.lineWidth = 1.5; for (let i = 0; i < 8; i++) { const a = i * 0.785; b.beginPath(); b.moveTo(x, y); b.lineTo(x + Math.cos(a) * 18, y + Math.sin(a) * 18); b.stroke(); }
    b.fillStyle = '#c9a24a'; b.beginPath(); b.arc(x, y, 3, 0, 6.283); b.fill();
  }
  // faint engraved sigil in the middle (original: a ring of flame around a crown)
  b.save(); b.translate(W / 2, H / 2); b.globalAlpha = 0.07; b.strokeStyle = '#d4a640'; b.fillStyle = '#d4a640'; b.lineWidth = 4;
  b.beginPath(); b.arc(0, 0, 120, 0, 6.283); b.stroke(); b.beginPath(); b.arc(0, 0, 104, 0, 6.283); b.stroke();
  for (let i = 0; i < 16; i++) { b.save(); b.rotate(i * 0.3927); b.beginPath(); b.moveTo(-8, -106); b.quadraticCurveTo(0, -150, 10, -106); b.fill(); b.restore(); }
  b.beginPath(); b.moveTo(-50, 25); b.lineTo(-50, -20); b.lineTo(-25, 5); b.lineTo(0, -40); b.lineTo(25, 5); b.lineTo(50, -20); b.lineTo(50, 25); b.closePath(); b.fill();

  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(25,0,0,0.7)');

      for (const b of bullets) { if (!!b.g !== green) continue; const r = (6 + (0.75 - b.life) * 26) * rk * (0.9 + 0.2 * Math.sin(b.life * 60)); ctx.moveTo(b.x + r, b.y); ctx.arc(b.x, b.y, r, 0, 6.283); }
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // enemy fireballs (Ashwing) glow
  ctx.fillStyle = 'rgba(255,40,10,0.35)'; ctx.beginPath();
  for (const b of ebullets) { if (b.kind !== 'fire') continue; ctx.moveTo(b.x + 12, b.y); ctx.arc(b.x, b.y, 12, 0, 6.283); } ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#2a0a08'; ctx.beginPath();
  for (const b of ebullets) { if (b.kind !== 'fire') continue; ctx.moveTo(b.x + 6, b.y); ctx.arc(b.x, b.y, 6, 0, 6.283); } ctx.fill();
  ctx.fillStyle = '#ff7a3a'; ctx.beginPath();
  for (const b of ebullets) { if (b.kind !== 'fire') continue; ctx.moveTo(b.x + 3, b.y); ctx.arc(b.x, b.y, 3, 0, 6.283); } ctx.fill();

  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2.5; ctx.beginPath();

  for (const b of ebullets) { if (b.kind !== 'bolt') continue; const c = Math.cos(b.a), sn = Math.sin(b.a);
    ctx.moveTo(b.x + c * 5, b.y + sn * 5); ctx.lineTo(b.x - sn * 3, b.y + c * 3); ctx.lineTo(b.x + sn * 3, b.y - c * 3); } ctx.fill();

  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.font = 'bold 13px Georgia, serif'; ctx.textAlign = 'center';
  for (const f of floaters) { ctx.globalAlpha = Math.max(0, f.t); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
  ctx.globalAlpha = 1;
  // crosshair
  if (state === 'play' && inputMode === 'kb') {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, 6.283);
    ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 14); ctx.stroke();
  } else if (state === 'play') {
    const ax = player.x + Math.cos(player.ang) * 60, ay = player.y + Math.sin(player.ang) * 60;
    ctx.fillStyle = 'rgba(240,184,74,0.8)'; ctx.beginPath(); ctx.arc(ax, ay, 3, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  // low-hp vignette
  if (state === 'play' && player.hp < 30) { ctx.fillStyle = `rgba(255,0,0,${0.08 + Math.sin(time * 6) * 0.05})`; ctx.fillRect(0, 0, W, H); }

  drawTouchUI();
  // banner
  if (bannerT > 0 && state === 'play') {
    const a = Math.min(1, bannerT, (2.4 - bannerT) * 4);

    ctx.font = 'italic bold 17px Georgia, serif'; ctx.fillStyle = '#e8dcc4'; ctx.textAlign = 'center'; ctx.fillText(bannerB, W / 2, H / 2 + 4);

    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    bigText('THE SKIES WAIT', H / 2 - 20, 64, '#e8b84a');
    ctx.font = 'bold 16px Georgia, serif'; ctx.fillStyle = '#e8dcc4'; ctx.textAlign = 'center';
    ctx.fillText(hint('P / ESC to resume   ·   M to mute', 'OPTIONS or ✕ to resume   ·   TOUCHPAD to mute', 'TAP ANYWHERE TO RESUME'), W / 2, H / 2 + 24);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(14,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    bigText('DANI HAS FALLEN', H / 2 - 70, 70, '#d8282f');
    ctx.font = 'italic 18px Georgia, serif'; ctx.fillStyle = '#e8dcc4'; ctx.textAlign = 'center';
    ctx.fillText('Her dragon cries out over the ashes.', W / 2, H / 2 - 30);
    bigText(score.toLocaleString(), H / 2 + 30, 48, '#f4e4c0');
    ctx.font = 'bold 16px Georgia, serif'; ctx.fillStyle = newHigh ? '#e8b84a' : '#a89a8a';
    ctx.fillText(newHigh ? '★ A NEW LEGEND ★' : 'DANI\'S BEST ' + highScore.toLocaleString(), W / 2, H / 2 + 62);
    ctx.fillStyle = '#a89a8a'; ctx.fillText('Reached wave ' + wave, W / 2, H / 2 + 86);
    if (Math.floor(time * 2) % 2 === 0) bigText(hint('CLICK OR PRESS ENTER TO RISE AGAIN', 'PRESS ✕ TO RISE AGAIN', 'TAP TO RISE AGAIN'), H / 2 + 140, 26, '#fff');
  }

}
function drawToast() {
  if (toastT <= 0) return;
  ctx.globalAlpha = Math.min(1, toastT * 2);
  ctx.font = 'bold 15px Georgia, serif'; const w = ctx.measureText(toastMsg).width + 30;
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(W / 2 - w / 2, H - 96, w, 30);
  ctx.strokeStyle = '#f0b84a'; ctx.strokeRect(W / 2 - w / 2 + .5, H - 95.5, w, 30);
  ctx.fillStyle = '#f0b84a'; ctx.textAlign = 'center'; ctx.fillText(toastMsg, W / 2, H - 76);
  ctx.globalAlpha = 1;
}

// ---------- main loop (fixed-step for stability) ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  pollPad();
  acc += dt;
  requestAnimationFrame(frame);
  try { while (acc >= STEP) { update(STEP); acc -= STEP; } draw(); }
  catch (err) { acc = 0; console.error(err); }
}
fit();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// test hook
window.__dragonfire = { get state() { return state; }, startGame, get score() { return score; }, get wave() { return wave; },
  get enemies() { return enemies.length; }, get hp() { return player ? player.hp : 0; }, get pos() { return player ? [Math.round(player.x), Math.round(player.y)] : null; },
  get shots() { return shotCount; }, get btns() { return touchButtons(); }, get W() { return W; }, get H() { return H; },
  skipTo(n) { wave = n - 1; enemies.length = 0; waveToSpawn = 0; bossAlive = false; waveDelay = 0; }, hurt(d) { player.inv = 0; player.shield = 0; damagePlayer(d); } };
